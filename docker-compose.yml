# Local development infrastructure. Application processes (web, api) run on the host.
# Usage: copy .env.example to .env, then `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: motoscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motoscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-motoscope}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - motoscope-pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is intentionally not included. Add it only when a concrete caching,
  # rate-limiting or background-processing need exists (see docs/ARCHITECTURE.md).

volumes:
  motoscope-pgdata:
